trigger: none

resources:
  pipelines:
  - pipeline: buildPipeline
    source: 'Build Pipeline1'

pool:
  vmImage: 'windows-latest'

steps:

- download: buildPipeline
  artifact: NZWalks

- powershell: |
    Write-Host "Deployment Started"
    Write-Host "$(Pipeline.Workspace)"
    Write-Host "========== FILES =========="
    Get-ChildItem "$(Pipeline.Workspace)" -Recurse | Select-Object FullName
  displayName: "Find Artifact Path"